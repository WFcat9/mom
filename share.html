  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #8aab8e 0%, #b8d4ba 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .box {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 380px;
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #fff;
      color: #8aab8e;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 40px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .hint {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 24px;
    }
    /* 花瓣动效 */
    .petal {
      position: fixed;
      width: 14px; height: 14px;
      background: rgba(255,255,255,0.25);
      border-radius: 50% 0 50% 0;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
    }
    .petal:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .petal:nth-child(2) { top: 20%; right: 15%; animation-delay: 2s; width: 10px; height: 10px; }
    .petal:nth-child(3) { bottom: 20%; left: 20%; animation-delay: 4s; width: 12px; height: 12px; }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      50% { transform: translateY(-12px) rotate(20deg); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>

  <div class="box">
    <div class="icon">🌸</div>
    <div class="title">妈妈的健康生活</div>
    <div class="sub">温馨陪伴 · 每一天<br/>点击进入您的专属健康空间</div>
    <a class="btn" href="./index.html">进入网站 💐</a>
    <div class="hint">此页面专为微信分享优化</div>
  </div>

  <script>
    // 自动跳转（3秒后）
    setTimeout(() => { window.location.href = './index.html'; }, 8000);
  </script>
</body>
